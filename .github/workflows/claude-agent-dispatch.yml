# .github/workflows/claude-agent-dispatch.yml
#
# OPTIONAL CLOUD-AUTONOMOUS LANE — disabled until you add ANTHROPIC_API_KEY
# as a repo secret. Lets you dispatch a single VACATION_QUEUE task from
# GitHub Mobile while on vacation. Runs Claude Agent SDK in a cloud
# runner, ships a PR, sends a notification.
#
# Setup (one time, ~5 min):
#   1. https://console.anthropic.com → API Keys → Create key (label it "github-actions-bookdrop")
#   2. GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#      Name: ANTHROPIC_API_KEY
#      Value: <paste the key>
#   3. Done. Workflow is now live.
#
# Cost: ~$0.50–$2 per task depending on size. The workflow caps spend at
# 200K tokens per task ($1 ceiling on Sonnet 4.6).
#
# How to use from GitHub Mobile:
#   Actions tab → Claude agent dispatch → Run workflow → enter task_id
#   (1-20 from VACATION_QUEUE.md) → Run
#
# Safety: workflow opens a PR, never auto-merges. You review before
# anything lands on master.

name: claude-agent-dispatch

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task number from VACATION_QUEUE.md (e.g. 5)'
        required: true
        type: string
      custom_instruction:
        description: 'OR: free-text instruction (overrides task_id if set)'
        required: false
        type: string

permissions:
  contents: write       # to push branch
  pull-requests: write  # to open PR
  issues: write         # to comment on issues

jobs:
  dispatch:
    name: Run Claude agent
    runs-on: ubuntu-latest
    # Disabled by default — drops a friendly notice if no secret configured.
    if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Claude Agent SDK
        run: npm install -g @anthropic-ai/claude-agent-sdk

      - name: Configure git identity
        run: |
          git config user.name "claude-agent-dispatch"
          git config user.email "claude-agent-dispatch@users.noreply.github.com"
          git checkout -b "claude/task-${{ inputs.task_id }}-$(date +%s)"

      - name: Compose task brief
        id: brief
        env:
          TASK_ID: ${{ inputs.task_id }}
          CUSTOM: ${{ inputs.custom_instruction }}
        run: |
          if [ -n "$CUSTOM" ]; then
            echo "TASK_BRIEF=$CUSTOM" >> $GITHUB_ENV
          else
            # Extract the task row from VACATION_QUEUE.md
            ROW=$(grep "^| $TASK_ID |" VACATION_QUEUE.md || true)
            if [ -z "$ROW" ]; then
              echo "::error::Task $TASK_ID not found in VACATION_QUEUE.md"
              exit 1
            fi
            echo "TASK_BRIEF=$(echo "$ROW")" >> $GITHUB_ENV
          fi

      - name: Run Claude agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASK_BRIEF: ${{ env.TASK_BRIEF }}
        run: |
          # Hard budget: 200K tokens (~$1 on Sonnet 4.6 at current pricing)
          # The agent sees the repo, runs build + tests + audit, opens a PR
          # only if all checks pass.
          claude-agent-sdk run \
            --model claude-sonnet-4-6 \
            --max-tokens 200000 \
            --allowed-tools "Read,Write,Edit,Bash,Grep,Glob" \
            --workspace . \
            --instruction "You are working on the BookDrop repo. Task: $TASK_BRIEF

            Constraints (non-negotiable):
            1. Read .claude/rules/vibe-standard.md before touching anything
            2. Run \`npm run build && npx vitest run\` after every change — both must pass
            3. Run \`npm run audit-docs\` if you touch any .md file — no new HARD violations
            4. Make one logical commit with a clear message ending in '🤖 via claude-agent-dispatch'
            5. If you can't complete the task safely, exit without committing and explain why
            6. Never edit .env, .env.local, or anything in supabase/migrations/ without explicit approval"

      - name: Push branch + open PR
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only push if there are commits
          if git rev-parse --quiet --verify HEAD > /dev/null && [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            git push -u origin HEAD
            gh pr create \
              --title "🤖 Vacation dispatch: task #${{ inputs.task_id }}" \
              --body "Auto-generated by \`claude-agent-dispatch.yml\` for VACATION_QUEUE task #${{ inputs.task_id }}.

Review the diff before merging. CI must be green.

Brief: ${TASK_BRIEF}" \
              --label "vacation-dispatch" \
              --base master
          else
            echo "::warning::Agent ran but produced no commits — nothing to PR."
          fi

  notify-not-configured:
    name: Notice if not configured
    runs-on: ubuntu-latest
    if: ${{ secrets.ANTHROPIC_API_KEY == '' }}
    steps:
      - run: |
          echo "::warning::ANTHROPIC_API_KEY secret not set — claude-agent-dispatch is disabled."
          echo "::warning::To enable: GitHub repo Settings → Secrets and variables → Actions → New repository secret named ANTHROPIC_API_KEY."
          echo "See PHONE_REVIEW.md 'option B' for setup instructions."
