# .github/workflows/vacation-watchdog.yml
# Nightly + on-demand health check. While the user is away, this runs every
# morning at 14:00 UTC (~7am PT / 10am ET), audits the repo, and opens a
# GitHub Issue if anything is broken or worth reviewing.
#
# The user sees the issue on GitHub Mobile while on vacation. No action
# needed for green nights — only failures generate noise.

name: vacation-watchdog

on:
  schedule:
    - cron: '0 14 * * *'   # daily at 14:00 UTC
  workflow_dispatch:        # also fire on demand from GitHub Mobile (Actions tab)
    inputs:
      open_issue_always:
        description: 'Open the morning report issue even if everything is green'
        required: false
        default: 'false'

jobs:
  watchdog:
    name: Nightly audit + morning report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write   # needed to open the morning-report issue
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: TypeScript + Vite build
        id: build
        run: npm run build
        continue-on-error: true

      - name: Vitest
        id: test
        run: npx vitest run
        continue-on-error: true

      - name: Doc-hygiene audit
        id: docs
        run: |
          set -e
          fail=0; warn=0
          while IFS= read -r f; do
            case "$f" in
              ./AGENTS.md|./GEMINI.md|./.windsurfrules|./PERPLEXITY_SPACE_INSTRUCTIONS.md|./.cursor/*) continue ;;
              *.harvest.md|*_ARCHIVE.md) continue ;;
            esac
            lines=$(wc -l < "$f")
            case "$f" in
              ./.claude/rules/*) soft=200; hard=280 ;;
              ./CURRENT_SPRINT.md) soft=80; hard=150 ;;
              ./V1_FEATURE_BACKLOG.md) soft=120; hard=200 ;;
              ./scripts/*) soft=200; hard=300 ;;
              *) soft=150; hard=250 ;;
            esac
            if [ "$lines" -gt "$hard" ]; then fail=$((fail+1)); echo "HARD $lines $f"; fi
            if [ "$lines" -gt "$soft" ] && [ "$lines" -le "$hard" ]; then warn=$((warn+1)); echo "SOFT $lines $f"; fi
          done < <(find . -name '*.md' -not -path './node_modules/*' -not -path './dist/*' -not -path './.git/*')
          echo "hard_violations=$fail" >> $GITHUB_OUTPUT
          echo "soft_warnings=$warn" >> $GITHUB_OUTPUT

      - name: Bug-checklist greps (advisory)
        id: bugs
        run: |
          # The fast-failing ones — // Simulated comments in production = stop-the-line
          MATCHES=$(grep -rEn '// Simulated|// simulated|// fake|// TODO real' src/ || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Simulated/fake markers found in production code:"
            echo "$MATCHES"
            echo "simulated_found=true" >> $GITHUB_OUTPUT
          else
            echo "simulated_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Compose morning report
        id: report
        run: |
          BUILD="${{ steps.build.outcome }}"
          TEST="${{ steps.test.outcome }}"
          DOC_HARD="${{ steps.docs.outputs.hard_violations }}"
          DOC_SOFT="${{ steps.docs.outputs.soft_warnings }}"
          SIM="${{ steps.bugs.outputs.simulated_found }}"
          ANY_FAIL=0
          [ "$BUILD" = "failure" ] && ANY_FAIL=1
          [ "$TEST" = "failure" ] && ANY_FAIL=1
          [ "$DOC_HARD" -gt 0 ] 2>/dev/null && ANY_FAIL=1
          [ "$SIM" = "true" ] && ANY_FAIL=1

          {
            echo "## Morning report — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Build (\`npm run build\`) | $BUILD |"
            echo "| Tests (\`vitest run\`) | $TEST |"
            echo "| Doc hygiene — HARD violations | $DOC_HARD |"
            echo "| Doc hygiene — SOFT warnings | $DOC_SOFT |"
            echo "| \`// Simulated\` markers in src/ | $SIM |"
            echo ""
            if [ "$ANY_FAIL" = "1" ]; then
              echo "### ⚠️ Something regressed overnight"
              echo ""
              echo "Open the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
            else
              echo "### ✅ Everything green"
              echo ""
              echo "No action needed."
            fi
            echo ""
            echo "_Generated by \`.github/workflows/vacation-watchdog.yml\`_"
          } > morning-report.md

          cat morning-report.md
          echo "any_fail=$ANY_FAIL" >> $GITHUB_OUTPUT

      - name: Open / update morning-report issue (only on failure or manual)
        if: steps.report.outputs.any_fail == '1' || github.event.inputs.open_issue_always == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('morning-report.md', 'utf8');
            const title = `Morning report ${new Date().toISOString().slice(0,10)}`;
            // Find an existing open issue with the "vacation-watchdog" label
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'vacation-watchdog',
              state: 'open',
              per_page: 1,
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
              console.log(`Commented on existing issue #${existing[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['vacation-watchdog'],
              });
              console.log(`Opened issue #${issue.number}`);
            }
